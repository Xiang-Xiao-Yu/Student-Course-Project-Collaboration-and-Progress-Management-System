name: Project quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      DATABASE_URL: file:./ci-unused.db
    steps:
      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prod=false
      - name: Generate the Prisma client
        run: pnpm db:generate
      - name: Diagnose SQLite startup
        working-directory: apps/api
        timeout-minutes: 1
        run: |
          @'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { createRequire } = require('node:module');
          let stage = 'load-client';
          const guard = setTimeout(() => {
            console.error(JSON.stringify({ stalledStage: stage }));
            process.exit(1);
          }, 20000);
          async function measure(name, action) {
            stage = name;
            const start = performance.now();
            const result = await action();
            console.log(JSON.stringify({ stage: name, milliseconds: Math.round(performance.now() - start) }));
            return result;
          }
          async function main() {
            const { PrismaClient } = require('@prisma/client');
            const clientRequire = createRequire(require.resolve('@prisma/client'));
            const engine = path.join(path.dirname(clientRequire.resolve('.prisma/client/default')), 'query_engine-windows.dll.node');
            console.log(JSON.stringify({ node: process.version, cpus: os.availableParallelism(), enginePathLength: engine.length, engineExists: fs.existsSync(engine) }));
            await measure('load-native-library', () => require(engine));
            const folder = fs.mkdtempSync(path.join(os.tmpdir(), 'scpc-ci-probe-'));
            const database = path.join(folder, 'probe.db').replaceAll('\\', '/');
            const prisma = new PrismaClient({ datasources: { db: { url: 'file:' + database } } });
            try {
              await measure('connect', () => prisma.$connect());
              await measure('select-one', () => prisma.$queryRawUnsafe('SELECT 1'));
              const migrations = path.resolve('../../prisma/migrations');
              const started = performance.now();
              let count = 0;
              for (const entry of fs.readdirSync(migrations, { withFileTypes: true }).filter(x => x.isDirectory()).sort((a, b) => a.name.localeCompare(b.name))) {
                for (const sql of fs.readFileSync(path.join(migrations, entry.name, 'migration.sql'), 'utf8').split(';').filter(x => x.trim())) {
                  stage = 'migration-' + (++count);
                  await prisma.$executeRawUnsafe(sql);
                }
              }
              console.log(JSON.stringify({ migrationStatements: count, milliseconds: Math.round(performance.now() - started) }));
            } finally {
              await prisma.$disconnect();
            }
          }
          main().then(() => clearTimeout(guard)).catch(error => {
            console.error(JSON.stringify({ failedStage: stage, error: String(error.message) }));
            clearTimeout(guard);
            process.exitCode = 1;
          });
          '@ | node
      - name: Test shared contracts
        run: pnpm --filter @scpc/shared test
      - name: Test desktop
        run: pnpm --filter @scpc/desktop test
      - name: Test API
        run: pnpm --filter @scpc/api exec vitest run --maxWorkers=1
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
