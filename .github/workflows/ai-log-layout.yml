name: AI log layout

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Check AI log layout
        run: |
          node --test tests/ai-logs/check-ai-log-layout.test.mjs
          node scripts/check-ai-log-layout.mjs
